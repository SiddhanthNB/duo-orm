# pyproject.toml
# This file defines the entire package, its dependencies, and its tooling.
# It is the single source of truth for packaging and project metadata.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "duo-orm"
version = "0.1.3"
authors = [
  { name="Siddhanth Bhimakari", email="siddhanth.n.b@gmail.com" },
]
description = "An opinionated, modern ORM for Python combining the power of SQLAlchemy 2.0 with a clean, symmetrical API for sync and async operations."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core dependencies required for the package to function.
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.8",
    "click>=8.0",
    "toml>=0.10",
    "aiosqlite>=0.17",
    "pydantic>=2.6,<3",
]

[tool.setuptools.packages.find]
include = ["duo_orm*"]

[project.urls]
"Homepage" = "https://github.com/SiddhanthNB/duo-orm"
"Bug Tracker" = "https://github.com/SiddhanthNB/duo-orm/issues"

# This section creates the `duo-orm` command-line tool.
# It points to the main `cli` group function inside our cli.py file.
[project.scripts]
duo-orm = "duo_orm.migrations.cli:cli"

[project.optional-dependencies]
all = [
    "psycopg[binary]>=3.1", # PostgreSQL (sync and async)
    "oracledb>=2.0", # Oracle (sync and async)
    "pymysql>=1.1", # MySQL (sync)
    "asyncmy>=0.2", # MySQL (async)
    "pyodbc>=5.0", # MSSQL (sync)
    "aioodbc>=0.5", # MSSQL (async)
    "aiosqlite>=0.20", # SQLite (async)
]
postgresql = ["psycopg[binary]>=3.1"]
oracle = ["oracledb>=2.0"]
mysql = ["pymysql>=1.1", "asyncmy>=0.2"]
mssql = ["pyodbc>=5.0", "aioodbc>=0.5"]
sqlite = ["aiosqlite>=0.20"]

# Dependencies only needed for developing and testing 'duo-orm' itself.
# Example: pip install -e .[dev]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.20",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "black>=23.0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings-python>=1.0",
]

# --- Tool Configuration ---

[tool.ruff]
# Standard Python code linter and formatter configuration.
line-length = 88
select = ["E", "F", "W", "I"] # Standard flake8 rules + isort

[tool.black]
line-length = 88

[tool.pytest.ini_options]
addopts = "-ra"
